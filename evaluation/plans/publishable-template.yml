version: 1
id: publishable-template
description: Template using two external judge families. Replace the pilot dataset with a 30-50 case held-out dataset before making quality claims.
councilBaseUrl: http://127.0.0.1:8080
dataset: ../datasets/pilot-v1.yml
rubric: ../rubrics/general-v1.yml
outputDirectory: ../results
seed: 20260821
repetitions: 3
execution:
  maxCalls: 3000
  maxEstimatedCostUsd: 50.0
  councilRequestTimeoutSeconds: 1800
  judgeInvalidRetries: 1
  continueOnFailure: true
  liveCallsAcknowledged: true
  billableCallsAcknowledged: true
models:
  - {id: direct-llama, provider: ollama, providerModelId: "llama3.1:8b", modelFamily: llama, baseUrl: "http://127.0.0.1:11434", maxOutputTokens: 1200, contextWindowTokens: 16384, temperature: 0.3, timeoutSeconds: 240, retryMaxAttempts: 1, retryBaseDelayMs: 500, costPer1kInputTokens: 0.0, costPer1kOutputTokens: 0.0}
  - {id: openai-judge, provider: openai, providerModelId: "gpt-4.1", modelFamily: gpt, maxOutputTokens: 1600, temperature: 0.1, timeoutSeconds: 180, retryMaxAttempts: 1, retryBaseDelayMs: 1000, costPer1kInputTokens: 0.0, costPer1kOutputTokens: 0.0}
  - {id: claude-judge, provider: anthropic, providerModelId: "claude-sonnet-4-20250514", modelFamily: claude, maxOutputTokens: 1600, temperature: 0.1, timeoutSeconds: 180, retryMaxAttempts: 1, retryBaseDelayMs: 1000, costPer1kInputTokens: 0.0, costPer1kOutputTokens: 0.0}
variants:
  - {id: direct-llama, displayName: Direct Llama, type: DIRECT, enabled: true, modelId: direct-llama}
  - {id: local-balanced, displayName: Local Balanced Council, type: COUNCIL, enabled: true, profileId: local, depthMode: BALANCED}
  - {id: local-rigorous, displayName: Local Rigorous Council, type: COUNCIL, enabled: true, profileId: local, depthMode: RIGOROUS}
comparisons:
  - {id: direct-vs-balanced, left: direct-llama, right: local-balanced, enabled: true}
  - {id: direct-vs-rigorous, left: direct-llama, right: local-rigorous, enabled: true, primary: true}
judges:
  - {id: openai, modelId: openai-judge, mirrored: true, enabled: true}
  - {id: claude, modelId: claude-judge, mirrored: true, enabled: true}
