version: 1
id: held-out-ablation
# The first held-out experiment. Unlike local-pilot this runs the held-out 36-case
# dataset and includes the SAME_MODEL_ENSEMBLE ablation, which is the comparison
# that separates "the council protocol helps" from "spending more calls helps".
# A direct-vs-council win with no ensemble arm cannot tell those apart.
description: Held-out comparison of a true direct baseline, a same-model ensemble ablation, and both the balanced and rigorous local councils, judged blind and mirrored by an independent local model family. One repetition by design; n is the 36 cases, not cases times repetitions.
councilBaseUrl: http://127.0.0.1:8080
dataset: ../datasets/held-out-v1.yml
rubric: ../rubrics/general-v1.yml
outputDirectory: ../results
seed: 20260819
# Deliberately 1, not 3. The interval is computed over CASES: MetricCalculator
# groups observations by caseId before WilsonScoreInterval sees them, so n is 36
# either way. Repetitions reduce per-case noise; they do not add independent
# observations and do not narrow the sampling interval.
#
# What that costs: at n=36 the 95% interval only clears 0.5 at 24/36 (66.7%).
# A 60/40 advantage needs 91 cases; 55/45 needs 370. So a third of a day spent on
# repetitions cannot make a modest effect visible - only more cases can.
#
# Stage it. Run this at 1 repetition. Runtime is hardware-dependent. A 24+/36
# result clears the case-level interval, but stochastic replication can still
# change the estimate or its sign. Treat this as the first held-out measurement
# and independently replicate a promising result before calling it settled. If it lands
# inconclusive, spend the next increment primarily on CASES rather than repetitions:
# ~100 cases at 1 repetition costs about what 36 cases at 3 repetitions does and
# resolves a materially smaller effect.
#
# Raise this to 3 only to reduce per-case measurement noise once n is adequate,
# and re-derive maxCalls when you do. Note the run id embeds the plan hash, so
# changing this value starts a NEW run - `resume` cannot bolt repetitions onto a
# finished one.
repetitions: 1
execution:
  # Derived, not guessed. 36 cases x 1 repetition = 36 answer units per variant.
  #   direct     36 x 1 call  x 2 transport attempts            =    72
  #   ensemble   36 x 6 calls x 2 transport attempts            =   432
  #   balanced   36 x 11 worst-case council calls               =   396
  #   rigorous   36 x 29 worst-case council calls               = 1,044
  #   judging    4 comparisons x 36 pairs x 2 mirror
  #              x 2 invalid-retry x 2 transport                = 1,152
  #   judge control preflight                                   =     2
  #                                                     total   = 3,098
  # 3,600 leaves ~16% headroom. Re-derive rather than raise this if `plan` refuses.
  # The rigorous figure is worst case: DEBATE is conditional (force-run false), and
  # when it is skipped REVISE and REVIEW_POST_DEBATE are skipped with it, so actual
  # consumption should land well under the reservation.
  maxCalls: 3600
  # All models are local Ollama, so nothing here is billable.
  maxEstimatedCostUsd: 0.0
  councilRequestTimeoutSeconds: 1800
  judgeInvalidRetries: 1
  continueOnFailure: true
  liveCallsAcknowledged: true
  billableCallsAcknowledged: false
models:
  # contextWindowTokens is 8192, not the 16384 the older local plans use. Prompts
  # here reach ~3,000 tokens (rubric plus two candidate answers) against at most
  # 1,600 output, so 8192 has ample headroom while allocating half the KV cache.
  # Raise it if candidate answers grow; a judge prompt that overflows num_ctx is
  # silently truncated by Ollama, which corrupts a judgment rather than failing it.
  #
  # Baseline model. Matched to the council's own member model so the comparison
  # isolates the protocol rather than the model. The remaining prompt-template
  # confound between the direct and council paths is disclosed, not removed.
  - {id: direct-llama, provider: ollama, providerModelId: "llama3.1:8b", modelFamily: llama, baseUrl: "http://127.0.0.1:11434", maxOutputTokens: 1200, contextWindowTokens: 8192, temperature: 0.3, timeoutSeconds: 600, retryMaxAttempts: 1, retryBaseDelayMs: 500, costPer1kInputTokens: 0.0, costPer1kOutputTokens: 0.0}
  # Judge. gemma shares no family with any council member (llama, mistral, qwen)
  # or with the baseline, which is what keeps the judge-independence warning quiet.
  # Temperature is low because the judge must return an exact JSON contract.
  - {id: gemma-judge, provider: ollama, providerModelId: "gemma4:12b-it-qat", modelFamily: gemma, baseUrl: "http://127.0.0.1:11434", maxOutputTokens: 1600, contextWindowTokens: 8192, temperature: 0.1, timeoutSeconds: 600, retryMaxAttempts: 1, retryBaseDelayMs: 500, costPer1kInputTokens: 0.0, costPer1kOutputTokens: 0.0}
variants:
  - {id: direct-llama, displayName: Direct Llama, type: DIRECT, enabled: true, modelId: direct-llama}
  # The ablation: same model, five independent samples, one synthesis call. If the
  # council only matches this, the gain is budget rather than protocol.
  - {id: llama-ensemble, displayName: Five-sample Llama Ensemble, type: SAME_MODEL_ENSEMBLE, enabled: true, modelId: direct-llama, samples: 5}
  - {id: local-balanced, displayName: Local Balanced Council, type: COUNCIL, enabled: true, profileId: local, depthMode: BALANCED}
  # Rigorous is ENABLED and is the point of the run. BALANCED's orderedStages are
  # [GENERATE, ANONYMIZE, REVIEW, SCORE, SYNTHESIZE, VALIDATE] - no DEBATE. Debate,
  # REVISE, REVIEW_POST_DEBATE and sycophancy detection are rigorous-only, and
  # sycophancy detection begins at debate round 1. A run without this variant
  # measures a council with the entire anti-sycophancy apparatus switched off,
  # which is the one thing this project exists to test.
  - {id: local-rigorous, displayName: Local Rigorous Council, type: COUNCIL, enabled: true, profileId: local, depthMode: RIGOROUS}
comparisons:
  # Preregistered PRIMARY: ensemble-vs-rigorous. It asks whether the protocol adds
  # value beyond spending multiple calls on the same model. The other comparisons
  # are secondary/exploratory and must not replace the primary after results exist.
  # Judging is ~55 min per comparison, so this is the deliberate half of the budget.
  #   Is any council better than one call?          direct-vs-balanced
  #   Is the gain protocol or just more calls?      ensemble-vs-rigorous
  #   Is the flagship better than one call?         direct-vs-rigorous
  #   Is debate worth 3x the cheap council?         balanced-vs-rigorous
  - {id: direct-vs-balanced, left: direct-llama, right: local-balanced, enabled: true}
  - {id: direct-vs-rigorous, left: direct-llama, right: local-rigorous, enabled: true}
  - {id: ensemble-vs-rigorous, left: llama-ensemble, right: local-rigorous, enabled: true, primary: true}
  - {id: balanced-vs-rigorous, left: local-balanced, right: local-rigorous, enabled: true}
judges:
  # One judge means there is no cross-judge majority to require, so a
  # position-unstable pair resolves to unresolved rather than being outvoted.
  # A second independent family is the stronger design; add one before treating
  # any margin here as settled. If this local-only plan is retained, complete a
  # blinded human-review subset and publish it separately; one model judge alone
  # supports an exploratory result, not a definitive quality claim.
  - {id: gemma-local, modelId: gemma-judge, mirrored: true, enabled: true}
