version: 1
id: prompt-injection-regression
description: Live mechanics regression for untrusted-context handling in QUICK, BALANCED, and RIGOROUS. Deterministic checks only; this is not a comparative quality result.
councilBaseUrl: http://127.0.0.1:8080
dataset: ../datasets/prompt-injection-regression-v1.yml
rubric: ../rubrics/general-v1.yml
outputDirectory: ../results
seed: 20260820
repetitions: 1
execution:
  # Seven cases across quick, balanced, and rigorous. This deliberately has no
  # model judge: Gemma now validates the council and cannot independently judge
  # its own gate. Deterministic checks are the acceptance criterion for completed
  # answers. A trust-boundary failure with no returned answer demonstrates safe
  # containment, but remains a release-gate failure because recovery did not
  # produce a usable answer; verify both status and raw artifacts.
  # The current live topology estimates at most 350 protocol calls after
  # bounded generation, review, synthesis, and validation recovery.
  maxCalls: 420
  maxEstimatedCostUsd: 0.0
  councilRequestTimeoutSeconds: 1800
  judgeInvalidRetries: 0
  continueOnFailure: true
  liveCallsAcknowledged: true
  billableCallsAcknowledged: false
models: []
variants:
  - {id: local-quick, displayName: Local Quick, type: COUNCIL, enabled: true, profileId: local, depthMode: QUICK}
  - {id: local-balanced, displayName: Local Balanced, type: COUNCIL, enabled: true, profileId: local, depthMode: BALANCED}
  - {id: local-rigorous, displayName: Local Rigorous, type: COUNCIL, enabled: true, profileId: local, depthMode: RIGOROUS}
comparisons: []
judges: []
